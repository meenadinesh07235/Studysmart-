<style>
  html { -webkit-text-size-adjust: 100%; }
  body { font-feature-settings: "ss01","cv11"; background:#0a1730; overflow-x:hidden; margin:0; transition: background-color 0.5s ease; }
  body.app-ready { background:#f4f6fc; }

  button, [role="button"], a, input, textarea, select { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  button, [role="button"] { -webkit-user-select: none; user-select: none; cursor: pointer; }
  button:disabled { cursor: not-allowed; }

  ::selection { background:#93b3ff; color:#0a1730; }
  * { -webkit-tap-highlight-color: transparent; }
  .no-scrollbar::-webkit-scrollbar { display:none; }
  .no-scrollbar { -ms-overflow-style:none; scrollbar-width:none; }

  @keyframes fadeUp { from { opacity:0; transform:translateY(10px);} to { opacity:1; transform:translateY(0);} }
  .anim-in { animation: fadeUp .38s cubic-bezier(.22,.9,.3,1) both; }
  @keyframes pop { 0% { transform:scale(.94); opacity:0 } 100% { transform:scale(1); opacity:1 } }
  .anim-pop { animation: pop .25s cubic-bezier(.22,.9,.3,1) both; }
  .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }

  /* ---------- SPLASH ---------- */
  #boot {
    position: fixed; inset: 0; z-index: 200;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 40%, #111f3d 0%, #0a1730 65%);
    color: #fff; font-family: "Plus Jakarta Sans", system-ui, sans-serif;
    transition: opacity .6s ease, visibility .6s ease;
  }
  #boot.hide { opacity: 0; visibility: hidden; pointer-events: none; }

  .splash-wrap {
    display: flex; flex-direction: column; align-items: center;
    gap: 0.75rem; padding: 2rem; text-align: center;
    animation: splashIn .6s ease both;
  }

  .splash-logo {
    width: 130px; height: 130px;
    display: flex; align-items: center; justify-content: center;
    filter: drop-shadow(0 25px 45px rgba(59,102,255,.45));
    animation: logoPop 1s cubic-bezier(.22,1.2,.36,1) both;
  }
  .splash-logo img { width: 100%; height: 100%; object-fit: contain; }

  .splash-title {
    font-size: 2rem; font-weight: 800; letter-spacing: -0.02em;
    margin: 0.5rem 0 0; animation: textSlide .7s .25s ease both;
  }
  .splash-title span { color: #5f8aff; }

  .splash-tagline {
    font-size: 0.9rem; color: #9fb5e0; margin: 0;
    letter-spacing: 0.02em;
    animation: textSlide .7s .4s ease both;
  }

  .splash-loader {
    width: 180px; height: 4px; border-radius: 4px;
    background: rgba(255,255,255,.1); overflow: hidden;
    margin-top: 1.5rem;
    animation: textSlide .7s .55s ease both;
  }
  .splash-loader-bar {
    height: 100%; width: 40%; border-radius: 4px;
    background: linear-gradient(90deg, #3b66ff, #8b5cf6);
    animation: loaderSlide 1.4s ease-in-out infinite;
  }

  .splash-credit {
    font-size: 0.7rem; color: #6c8ecc; margin: 1rem 0 0;
    letter-spacing: 0.15em; text-transform: uppercase; font-weight: 700;
    animation: textSlide .7s .75s ease both;
  }
  .splash-credit strong { color: #93b3ff; font-weight: 800; }

  @keyframes splashIn { from { opacity: 0 } to { opacity: 1 } }
  @keyframes logoPop {
    0%   { opacity: 0; transform: scale(.5) rotate(-10deg); }
    60%  { opacity: 1; transform: scale(1.1) rotate(3deg); }
    100% { opacity: 1; transform: scale(1) rotate(0); }
  }
  @keyframes textSlide { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes loaderSlide { 0% { transform: translateX(-120%); } 100% { transform: translateX(320%); } }

  /* ---------- AI SPLASH ---------- */
  .ai-splash {
    position: fixed; inset: 0; z-index: 150;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 50%, #1a2ca8 0%, #0a1730 70%);
    color: #fff; font-family: "Plus Jakarta Sans", system-ui, sans-serif;
    transition: opacity .4s ease, visibility .4s ease;
  }
  .ai-splash.hide { opacity: 0; visibility: hidden; pointer-events: none; }
  .ai-splash-icon {
    width: 80px; height: 80px; border-radius: 24px;
    background: linear-gradient(135deg, #3b66ff, #8b5cf6);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 40px rgba(139, 92, 246, 0.6);
    animation: pulseGlow 2s infinite alternate;
  }
  @keyframes pulseGlow {
    from { box-shadow: 0 0 20px rgba(139, 92, 246, 0.4); }
    to { box-shadow: 0 0 60px rgba(139, 92, 246, 0.8); }
  }
  .ai-splash-title {
    font-size: 1.8rem; font-weight: 800; margin-top: 1.5rem;
    letter-spacing: -0.02em;
  }
  .ai-splash-title span { color: #8b5cf6; }
  .ai-splash-sub {
    font-size: 0.9rem; color: #9fb5e0; margin-top: 0.5rem;
  }

  /* ---------- 3D Model Animation ---------- */
  .scene {
    width: 200px; height: 200px;
    perspective: 600px;
    margin: 0 auto;
  }
  .cube {
    width: 100%; height: 100%;
    position: relative;
    transform-style: preserve-3d;
    animation: rotateCube 12s infinite linear;
  }
  .cube-face {
    position: absolute;
    width: 200px; height: 200px;
    border: 2px solid rgba(59,102,255,0.4);
    background: rgba(59,102,255,0.05);
    display: flex; align-items: center; justify-content: center;
    font-weight: bold; color: #2044f0;
    backdrop-filter: blur(4px);
    border-radius: 12px;
  }
  .front  { transform: translateZ(100px); }
  .back   { transform: rotateY(180deg) translateZ(100px); }
  .right  { transform: rotateY(90deg) translateZ(100px); }
  .left   { transform: rotateY(-90deg) translateZ(100px); }
  .top    { transform: rotateX(90deg) translateZ(100px); }
  .bottom { transform: rotateX(-90deg) translateZ(100px); }
  
  @keyframes rotateCube {
    0% { transform: rotateX(0deg) rotateY(0deg); }
    100% { transform: rotateX(360deg) rotateY(360deg); }
  }

  /* ---------- CRASH OVERLAY ---------- */
  #crash { position: fixed; inset: 0; z-index: 300; display: none; padding: 20px; overflow: auto; background: #0a1730; color: #fff; font-family: ui-monospace, monospace; }
  #crash.show { display: block; }
  #crash h1 { font-family: system-ui, sans-serif; font-size: 18px; margin: 0 0 8px; }
  #crash p.lead { font-family: system-ui, sans-serif; font-size: 13px; color: #9fb5e0; line-height: 1.6; margin: 0 0 16px; }
  #crash pre { white-space: pre-wrap; word-break: break-word; font-size: 12px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); border-radius: 12px; padding: 14px; line-height: 1.6; color: #ffd7d7; }

    .splash-logo, .splash-title, .splash-tagline, .splash-loader, .splash-credit, .anim-in, .anim-pop { animation-duration: .01ms !important; }
    .splash-loader-bar { animation: none !important; width: 100%; }
    .cube { animation: none; }
    .ai-splash-icon { animation: none; }
  }
</style>

<script>
(function(){
  window.__splashStart = Date.now();
  window.__splashMinMs = 2000;

  function show(title, detail){
    var el = document.getElementById('crash');
    if(!el || el.classList.contains('show')) return;
    var d = String(detail || '').replace(/[<>&]/g, function(c){ return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c]; });
    el.innerHTML = '<h1>'+title+'</h1><p class="lead">StudySmart could not start. Check your internet connection and ensure logo.png is in the folder, then reload.</p><pre>'+d+'</pre>';
    el.classList.add('show');
    var boot = document.getElementById('boot');
    if(boot) boot.style.display = 'none';
  }
  window.__ssCrash = show;
  window.addEventListener('error', function(e){
    if(e && e.target && e.target.tagName === 'SCRIPT'){ show('Script failed to load', 'Failed: ' + (e.target.src || 'inline')); return; }
    show('Runtime error', (e && e.message) || 'Unknown');
  }, true);
  window.addEventListener('unhandledrejection', function(e){ show('Unhandled error', (e.reason && e.reason.message) || String(e.reason)); });
})();
</script>

const cx = (...a) => a.filter(Boolean).join(" ");

function findSubject(id){ return ALL_SUBJECTS.find(s => s.id === id); }
function findResource(subjectId, noteId){
  const subject = findSubject(subjectId);
  if(!subject) return null;
  for(const unit of subject.units){
    const resource = unit.resources.find(r => r.id === noteId);
    if(resource) return { subject, unit, resource };
  }
  return null;
}
function timeAgo(ts){
  const s = Math.floor((Date.now() - ts)/1000);
  if(s < 60) return "just now";
  const m = Math.floor(s/60); if(m < 60) return m + " min ago";
  const hr = Math.floor(m/60); if(hr < 24) return hr + " hr ago";
  const d = Math.floor(hr/24);
  if(d === 1) return "yesterday";
  if(d < 7) return d + " days ago";
  return new Date(ts).toLocaleDateString();
}
const isToday = (ts) => new Date(ts).toDateString() === new Date().toDateString();

function useLocalStorage(key, initial){
  const [value, setValue] = useState(() => {
    try { const raw = localStorage.getItem(key); return raw === null ? initial : JSON.parse(raw); }
    catch(e){ return initial; }
  });
  useEffect(() => {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch(e){}
  }, [key, value]);
  return [value, setValue];
}

function ProgressRing({ value, size = 84, stroke = 8, children, trackClass = "text-navy-100" }){
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const clamped = Math.min(100, Math.max(0, value));
  const offset = c - (clamped / 100) * c;
  return html`<div className="relative inline-flex shrink-0 items-center justify-center" style=${{ width: size, height: size }}>
    <svg width=${size} height=${size} className="-rotate-90" aria-hidden="true">
      <circle cx=${size/2} cy=${size/2} r=${r} strokeWidth=${stroke} stroke="currentColor" className=${cx("fill-none", trackClass)} />
      <circle cx=${size/2} cy=${size/2} r=${r} strokeWidth=${stroke} strokeLinecap="round" stroke="currentColor"
        className="fill-none text-brand-500 transition-[stroke-dashoffset] duration-700 ease-out"
        strokeDasharray=${c} strokeDashoffset=${offset} />
    </svg>
    <div className="absolute inset-0 flex flex-col items-center justify-center">${children}</div>
  </div>`;
}

function Modal({ open, onClose, children }){

    const onKey = (e) => { if(e.key === "Escape") onClose(); };

    document.body.style.overflow = "hidden";
    return () => { document.removeEventListener("keydown", onKey); document.body.style.overflow = ""; };
  }, [open, onClose]);
  if(!open) return null;
  return html`<div className="fixed inset-0 z-[70] flex items-end justify-center sm:items-center sm:p-6" role="dialog" aria-modal="true">

function AIChat() {
  const { back, toast } = useApp();
  const [showSplash, setShowSplash] = useState(true);
  const [messages, setMessages] = useState([
    { id: 1, sender: "ai", text: "Welcome to StudySmart AI! Ask a question, upload an image of your notes, or generate study materials.", type: "text" }
  ]);
  const [input, setInput] = useState("");
  const [isTyping, setIsTyping] = useState(false);
  const [imagePreview, setImagePreview] = useState(null);
  const [imageFile, setImageFile] = useState(null);

  // Gemini-specific settings
  const [apiKey, setApiKey] = useLocalStorage("ss_gemini_key", "");
  const [model, setModel] = useLocalStorage("ss_gemini_model", "gemini-3.8-flash");
  const [showSettings, setShowSettings] = useState(false);
  const [tempKey, setTempKey] = useState(apiKey);
  const [tempModel, setTempModel] = useState(model);
  const [isSpeakingEnabled, setIsSpeakingEnabled] = useLocalStorage("ss_voice_enabled", true);

  const chatEndRef = useRef(null);
  const fileInputRef = useRef(null);
  const cameraInputRef = useRef(null);

  const GEMINI_MODELS = [
    { id: "gemini-3.8-flash", label: "Gemini 3.8 Flash (latest)" },
    { id: "gemini-3.8-flash-cyber", label: "Gemini 3.8 Flash Cyber (security)" },
    { id: "gemini-3.8-flash-tts", label: "Gemini 3.8 Flash TTS (text-to-speech)" },
    { id: "gemini-2.5-flash", label: "Gemini 2.5 Flash (legacy)" }
  ];

  // AI Splash Timer
  useEffect(() => {
    const t = setTimeout(() => setShowSplash(false), 2500);
    return () => clearTimeout(t);
  }, []);

  // Auto-scroll chat
  useEffect(() => {
    if(chatEndRef.current) {
      chatEndRef.current.scrollIntoView({ behavior: "smooth" });
    }
  }, [messages, isTyping]);

  // Speech Synthesis (Text-to-Speech)
  const speakText = (text) => {
    if (!('speechSynthesis' in window) || !isSpeakingEnabled) return;
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.rate = 1.0;
    utterance.pitch = 1.0;
    utterance.volume = 1.0;
    const voices = window.speechSynthesis.getVoices();
    const preferredVoice = voices.find(v => v.name.includes("Google") || v.name.includes("Natural")) || voices[0];
    if (preferredVoice) utterance.voice = preferredVoice;
    window.speechSynthesis.speak(utterance);
  };

  // Convert File -> raw base64 (no data: prefix)
  const fileToBase64 = (file) => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = () => resolve(String(reader.result).split(',')[1]);
    reader.onerror = reject;
  });

  const handleSend = async (text, type = "text", payload = null, file = null) => {
    if(!text.trim() && !payload) return;

    const userMsg = { id: Date.now(), sender: "user", text, type, image: payload };
    setMessages(prev => [...prev, userMsg]);
    setInput("");
    setImagePreview(null);

    // IMPORTANT: use the file passed in (not the stale state) when called from upload
    const activeFile = file || imageFile;
    setImageFile(null);
    setIsTyping(true);

    setTimeout(async () => {
      let aiResponse = "";
      let aiType = "text";
      let aiData = null;

      // ---------- REAL GEMINI CALL ----------
      if (apiKey.trim().length > 10) {
        try {
          const parts = [{ text: text || "Describe this image." }];

          // Attach image as inline_data if present
          if (activeFile) {
            try {
              const base64 = await fileToBase64(activeFile);
              parts.push({
                inline_data: {
                  mime_type: activeFile.type || "image/jpeg",
                  data: base64
                }
              });
            } catch (imgErr) {
              console.warn("Could not convert image for Gemini:", imgErr);
            }
          }

          const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
          const response = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ contents: [{ parts }] })
          });

          const data = await response.json();

          if (data.error) {
            aiResponse = `API Error: ${data.error.message}. Please check your API key, model, or quota.`;
          } else if (
            data.candidates &&
            data.candidates.length > 0 &&
            data.candidates[0].content &&
            data.candidates[0].content.parts &&
            data.candidates[0].content.parts[0] &&
            data.candidates[0].content.parts[0].text
          ) {
            aiResponse = data.candidates[0].content.parts[0].text;
          } else {
            aiResponse = "No response received from Gemini. The prompt may have been blocked by safety filters, or the response was empty.";
          }
        } catch (err) {
          console.error(err);
          aiResponse = `Oops! Something went wrong: ${err.message}`;
        }
      } else {
        // ---------- SIMULATED DEMO MODE ----------
        if (type === "image") {
          aiResponse = "Oh, I see the image you uploaded! It looks like a physics problem involving vectors. The key concept here is resolving the forces into x and y components. Let me know if you want me to solve it step-by-step!";
        } else if (text.toLowerCase().includes("flashcard")) {
          aiResponse = "Here are some flashcards I generated for you based on Unit 1 of Physics. Take a look!";
          aiType = "flashcards";
          aiData = [
            { front: "Scalar", back: "A quantity with magnitude only (e.g., mass, time)." },
            { front: "Vector", back: "A quantity with magnitude and direction (e.g., velocity, force)." },
            { front: "Newton's 1st Law", back: "A body remains at rest or in uniform motion unless acted upon by an external force." }
          ];
        } else if (text.toLowerCase().includes("summary") || text.toLowerCase().includes("notes")) {
          aiResponse = "Sure thing! Here's a quick, easy-to-read summary of Limits & Derivatives:";
          aiType = "summary";
          aiData = [
            "A limit describes the value a function approaches as the input approaches a point.",
            "Standard limits: lim(x→0) sin x / x = 1.",
            "Derivative measures the rate of change: f'(x) = lim(h→0) [f(x+h) - f(x)] / h.",
            "Power rule: d/dx (xⁿ) = n·xⁿ⁻¹."
          ];
        } else if (text.toLowerCase().includes("hello") || text.toLowerCase().includes("hi")) {
          aiResponse = "Hello Deepak! 👋 I'm so glad you're here. Ready to crush your study goals today? I can help you summarize notes, create flashcards, or explain a tricky concept.";
        } else {
          aiResponse = "That's a really great question! Based on the first-year engineering curriculum, I'd recommend focusing on the core principles first. Would you like me to generate a quick summary or a set of flashcards to help you revise?";
        }
      }

      setMessages(prev => [...prev, { id: Date.now() + 1, sender: "ai", text: aiResponse, type: aiType, data: aiData }]);
      setIsTyping(false);
      speakText(aiResponse);
    }, 1000);
  };

  const handleImageUpload = (e) => {
    const file = e.target.files[0];
    if(file) {
      setImageFile(file);
      const url = URL.createObjectURL(file);
      setImagePreview(url);
      // Pass the file explicitly so handleSend can use it immediately
      handleSend("Analyze this image", "image", url, file);
    }
    // Allow re-uploading the same file
    e.target.value = "";
  };

  return html`<div className="flex flex-col h-[calc(100vh-120px)] sm:h-[calc(100vh-100px)] relative bg-navy-50">
    
    <!-- AI Splash Overlay -->
    <div className=${cx("ai-splash", !showSplash && "hide")}>
      <div className="ai-splash-icon">
        <${Icon} name="sparkles" className="h-10 w-10 text-white" strokeWidth=${2} />
      </div>
      <h1 className="ai-splash-title">StudySmart<span>.ai</span></h1>
      <p className="ai-splash-sub">Powered by Gemini</p>
    </div>

    <!-- Settings Modal -->
    <${Modal} open=${showSettings} onClose=${() => setShowSettings(false)}>
      <div className="flex items-center gap-3 mb-4">
        <div className="grid h-10 w-10 place-items-center rounded-xl bg-navy-100 text-navy-600">
          <${Icon} name="settings" className="h-5 w-5" />
        </div>
        <div>
          <h3 className="text-lg font-extrabold tracking-tight text-navy-900">AI Settings</h3>
          <p className="text-[12px] text-navy-500">Configure your Gemini API key and model.</p>
        </div>
      </div>
      
      <div className="space-y-4">
        <div>
          <label className="mb-1.5 block text-[13px] font-bold text-navy-700">Gemini API Key</label>
          <input 
            type="password" 
            value=${tempKey} 
            onInput=${e => setTempKey(e.target.value)}
            placeholder="AIza..." 
            className="w-full rounded-xl border border-navy-200 px-4 py-3 text-sm outline-none transition focus:border-brand-500 focus:ring-4 focus:ring-brand-500/15" 
          />
          <p className="mt-1.5 text-[11px] leading-4 text-navy-400">
            Leave blank to use the simulated demo mode. Get a key at <a href="https://aistudio.google.com/app/apikey" target="_blank" className="text-brand-600 hover:underline">aistudio.google.com</a>.
          </p>
        </div>

        <div>
          <label className="mb-1.5 block text-[13px] font-bold text-navy-700">Model</label>
          <select 
            value=${tempModel} 
            onChange=${e => setTempModel(e.target.value)}
            className="w-full rounded-xl border border-navy-200 px-4 py-3 text-sm outline-none transition focus:border-brand-500 focus:ring-4 focus:ring-brand-500/15 bg-white"
          >
            ${GEMINI_MODELS.map(m => html`<option key=${m.id} value=${m.id}>${m.label}</option>`)}
          </select>
          <p className="mt-1.5 text-[11px] leading-4 text-navy-400">
            Gemini 3.8 Flash (gemini-3.8-flash) is Google's latest general-purpose Flash model[reference:4].
          </p>
        </div>

        <div className="flex items-center justify-between rounded-xl border border-navy-100 bg-navy-50/60 px-3.5 py-3">

        <${Button} className="w-full" onClick=${() => { setApiKey(tempKey); setModel(tempModel); setShowSettings(false); toast("Settings saved"); }}>
          Save Settings

      </div>
    </${Modal}>

    <!-- Chat Header -->
    <div className="flex items-center justify-between px-4 py-3 border-b border-navy-100 bg-white shadow-sm z-10">
      <div className="flex items-center gap-3">

          </div>
          <div>

              <span className="h-1.5 w-1.5 rounded-full bg-emerald-500 animate-pulse"></span> Online · ${model}

      </div>
      
      <div className="flex items-center gap-1">
        <button onClick=${() => setIsSpeakingEnabled(!isSpeakingEnabled)} className=${cx("grid h-8 w-8 place-items-center rounded-lg transition", isSpeakingEnabled ? "text-brand-600 bg-brand-50" : "text-navy-400 hover:bg-navy-50")} title="Toggle voice">

        <button onClick=${() => setShowSettings(true)} className="grid h-8 w-8 place-items-center rounded-lg text-navy-500 hover:bg-navy-50 transition" title="Settings">

    <!-- Chat Messages -->
    <div className="flex-1 overflow-y-auto p-4 space-y-4">

      </button>
    </div>

    <!-- Input Area -->
    <div className="p-3 bg-white border-t border-navy-100 safe-bottom">
      ${imagePreview ? html`<div className="mb-2 relative inline-block">
        <img src=${imagePreview} className="h-16 w-16 object-cover rounded-lg border border-navy-200" />
        <button onClick=${() => { setImagePreview(null); setImageFile(null); }} className="absolute -top-2 -right-2 bg-rose-500 text-white rounded-full p-1 shadow-md">
          <${Icon} name="x" className="h-3 w-3" strokeWidth=${3} />

      <form onSubmit=${(e) => { e.preventDefault(); handleSend(input); }} className="flex items-end gap-2">

          <button type="button" onClick=${() => fileInputRef.current?.click()} className="p-2.5 text-navy-400 hover:text-brand-600 transition" title="Upload Image">

          <input type="file" accept="image/*" ref=${fileInputRef} onChange=${handleImageUpload} className="hidden" />
          
          <button type="button" onClick=${() => cameraInputRef.current?.click()} className="p-2.5 text-navy-400 hover:text-brand-600 transition" title="Take Photo">

        <div className="mt-4 grid grid-cols-2 gap-1 rounded-xl bg-navy-50 p-1">

            className=${cx("rounded-lg py-2 text-[13px] font-bold transition active:scale-[0.97]",
              mode === m ? "bg-white text-navy-900 shadow-soft" : "text-navy-500 hover:text-navy-700")}>

        <form onSubmit=${submit} className="mt-4 space-y-3.5" noValidate>
          ${mode === "signup" ? html`<div>
            <label htmlFor="name" className="mb-1.5 block text-[13px] font-bold text-navy-700">Full name</label>
            <input id="name" value=${name} onInput=${e => setName(e.target.value)} placeholder="Your name"

          <div>

              className="w-full rounded-xl border border-navy-200 bg-white px-4 py-3 text-sm outline-none transition focus:border-brand-500 focus:ring-4 focus:ring-brand-500/15" />
          </div>
          <div>
            <label htmlFor="password" className="mb-1.5 block text-[13px] font-bold text-navy-700">Password</label>
            <input id="password" type="password" value=${password} onInput=${e => setPassword(e.target.value)}
              className="w-full rounded-xl border border-navy-200 bg-white px-4 py-3 text-sm outline-none transition focus:border-brand-500 focus:ring-4 focus:ring-brand-500/15" />
          </div>

          ${error ? html`<div className="flex items-start gap-2 rounded-xl border border-rose-200 bg-rose-50 px-3.5 py-3 text-[13px] font-medium text-rose-700">
            <${Icon} name="info" className="mt-0.5 h-4 w-4 shrink-0" /> ${error}
          </div>` : null}

          <${Button} type="submit" size="lg" variant="primary" className="w-full">
            ${mode === "signin" ? "Sign in to StudySmart" : "Create demo account"} <${Icon} name="arrowRight" className="h-4 w-4" />
          </${Button}>
        </form>

        <${Button} variant="subtle" size="md" className="mt-3 w-full" onClick=${() => signIn("dashboard")}>
          <${Icon} name="sparkles" className="h-4 w-4" /> Continue with demo account
        </${Button}>

        <p className="mt-4 text-center text-[11px] leading-5 text-navy-400">
          Prototype authentication. Credentials are not verified and nothing is sent to a server.
        </p>
        <p className="mt-2 text-center text-[10.5px] font-semibold uppercase tracking-widest text-navy-300">
          Created by GROUP 1D
        </p>
      </div>
    </div>
  </div>`;
}

/* =========================================================
   Dashboard
   ========================================================= */
function Dashboard(){
  const { user, recent, results, bookmarks, go, openNote, navigate, quizzes } = useApp();
  const [q, setQ] = useState("");
  const [showResults, setShowResults] = useState(false);
  const firstName = (user.name || "Student").split(" ")[0];

  const searchResults = useMemo(() => {
    const term = q.trim().toLowerCase();
    if(!term) return [];
    const out = [];
    ALL_SUBJECTS.forEach(s => {
      if(s.name.toLowerCase().includes(term) || s.code.toLowerCase().includes(term)){
        out.push({ kind:"subject", subject:s, label:s.name, sub:s.code + " · Subject" });
      }
      s.units.forEach(u => u.resources.forEach(r => {
        if(r.title.toLowerCase().includes(term) || r.summary.toLowerCase().includes(term) || u.title.toLowerCase().includes(term)){
          out.push({ kind:"note", subject:s, resource:r, label:r.title, sub:s.name + " · " + r.type });
        }
      }));
    });
    return out.slice(0, 8);
  }, [q]);

  const resultList = Object.values(results);
  const quizzesDone = resultList.length;
  const avgPct = quizzesDone ? Math.round(resultList.reduce((a,r) => a + (r.score/r.total)*100, 0) / quizzesDone) : 0;
  const todayActivities = resultList.filter(r => isToday(r.at)).length + recent.filter(r => isToday(r.at)).length;
  const dailyPct = Math.min(100, Math.round((todayActivities/3)*100));
  const continueItem = recent[0] ? findResource(recent[0].subjectId, recent[0].noteId) : null;

  const subjectProgress = (subject) => {
    const total = subject.units.reduce((a,u) => a + u.resources.length, 0);
    const opened = Math.min(recent.filter(r => r.subjectId === subject.id).length, total);
    return { total, opened, pct: total ? Math.round((opened/total)*100) : 0 };
  };

  return html`<div className="anim-in space-y-5 sm:space-y-6">
    <div>
      <p className="text-[12px] font-semibold text-navy-500 sm:text-[13px]">
        ${new Date().toLocaleDateString(undefined, { weekday:"long", day:"numeric", month:"short" })}
      </p>
      <h1 className="mt-0.5 text-[22px] font-extrabold leading-tight tracking-tight text-navy-900 sm:text-[26px]">
        Welcome back, ${firstName}! <span className="inline-block">👋</span>
      </h1>
      <p className="mt-1 text-[13px] text-navy-500 sm:text-sm">Pick up where you left off, or start something new.</p>
    </div>

    <div className="relative">
      <div className="relative">
        <${Icon} name="search" className="pointer-events-none absolute left-4 top-1/2 h-5 w-5 -translate-y-1/2 text-navy-400" />
        <input value=${q}
          onInput=${e => { setQ(e.target.value); setShowResults(true); }}
          onFocus=${() => setShowResults(true)}
          onBlur=${() => setTimeout(() => setShowResults(false), 160)}
          placeholder="Search notes, subjects, quizzes…"
          aria-label="Search notes and subjects"
          className="w-full rounded-2xl border border-navy-200 bg-white py-3.5 pl-12 pr-4 text-sm shadow-soft outline-none transition placeholder:text-navy-400 focus:border-brand-500 focus:ring-4 focus:ring-brand-500/12" />
      </div>

      ${showResults && q.trim() ? html`<${Card} className="absolute left-0 right-0 top-full z-30 mt-2 max-h-80 overflow-y-auto p-1.5">
        ${searchResults.length === 0
          ? html`<div className="px-4 py-6 text-center">
              <p className="text-sm font-semibold text-navy-700">No matches for “${q}”</p>
              <p className="mt-1 text-[13px] text-navy-500">Try “vectors”, “limits”, “arrays” or “Ohm”.</p>
            </div>`
          : searchResults.map((r,i) => html`<button key=${i}
              onMouseDown=${e => e.preventDefault()}
              onClick=${() => {
                setShowResults(false); setQ("");
                if(r.kind === "subject") go("subject", { subjectId: r.subject.id });
                else openNote(r.subject.id, r.resource.id);
              }}
              className="flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-left transition hover:bg-navy-50 active:bg-navy-100">
              <div className=${cx("grid h-9 w-9 shrink-0 place-items-center rounded-lg", TINTS[r.subject.tint].bg, TINTS[r.subject.tint].text)}>
                <${Icon} name=${r.kind === "subject" ? r.subject.icon : "file"} className="h-4 w-4" />
              </div>
              <div className="min-w-0 flex-1">
                <p className="truncate text-[13px] font-bold text-navy-900">${r.label}</p>
                <p className="truncate text-[11px] text-navy-500">${r.sub}</p>
              </div>
              <${Icon} name="chevronRight" className="h-4 w-4 shrink-0 text-navy-300" />
            </button>`)}
      </${Card}>` : null}
    </div>

    <div className="grid grid-cols-3 gap-2.5 sm:gap-3">
      ${[
        { icon:"file", label:"Notes", screen:"subjects", tone:"bg-brand-50 text-brand-600" },
        { icon:"help", label:"Quizzes", screen:"quizzes", tone:"bg-violet-50 text-violet-600" },
        { icon:"bookmark", label:"My Library", screen:"library", tone:"bg-emerald-50 text-emerald-600" }
      ].map(a => html`<button key=${a.label} onClick=${() => navigate(a.screen)}
        className="group flex flex-col items-center gap-2 rounded-2xl border border-navy-100 bg-white py-3.5 shadow-soft transition hover:-translate-y-0.5 hover:border-navy-200 hover:shadow-lift active:translate-y-0 active:scale-[0.98] sm:py-4">
        <span className=${cx("grid h-11 w-11 place-items-center rounded-xl transition group-hover:scale-105", a.tone)}>
          <${Icon} name=${a.icon} className="h-5 w-5" />
        </span>
        <span className="text-[11.5px] font-bold text-navy-700 sm:text-[12px]">${a.label}</span>
      </button>`)}
    </div>

    <div className="grid gap-3 sm:grid-cols-5">
      <${Card} className="p-4 sm:p-5 sm:col-span-3">
        <div className="flex items-center gap-4 sm:gap-5">
          <${ProgressRing} value=${dailyPct} size=${92} stroke=${9}>
            <span className="text-lg font-extrabold text-navy-900">${dailyPct}%</span>
            <span className="text-[10px] font-semibold uppercase tracking-wide text-navy-400">today</span>
          </${ProgressRing}>
          <div className="min-w-0 flex-1">
            <div className="flex items-center gap-2">
              <h3 className="text-[14px] font-extrabold text-navy-900 sm:text-[15px]">Daily learning goal</h3>
              <${Icon} name="flame" className="h-4 w-4 text-orange-500" />
            </div>
            <p className="mt-1 text-[12.5px] leading-5 text-navy-500 sm:text-[13px]">
              ${todayActivities >= 3 ? "Goal complete — nicely done today." : todayActivities + " of 3 activities done. Open a note or attempt a quiz."}
            </p>
            <div className="mt-2.5 flex flex-wrap gap-1.5 sm:mt-3 sm:gap-2">
              <${Badge} tone="brand">${quizzesDone} quizzes</${Badge}>
              <${Badge} tone="green">${avgPct}% avg</${Badge}>
              <${Badge} tone="violet">${bookmarks.length} saved</${Badge}>
            </div>
          </div>
        </div>
      </${Card}>

      <${Card} className="flex flex-col justify-between p-4 sm:p-5 sm:col-span-2">
        <div className="flex items-center justify-between">
          <h3 className="text-[14px] font-extrabold text-navy-900 sm:text-[15px]">Quiz statistics</h3>
          <${Icon} name="chart" className="h-4 w-4 text-navy-400" />
        </div>
        <div className="mt-3 grid grid-cols-2 gap-3">
          <div>
            <p className="text-xl font-extrabold tracking-tight text-navy-900 sm:text-2xl">${quizzesDone}<span className="text-sm font-bold text-navy-400">/${Object.keys(QUIZZES).length}</span></p>
            <p className="text-[10.5px] font-semibold uppercase tracking-wide text-navy-400">Completed</p>
          </div>
          <div>
            <p className="text-xl font-extrabold tracking-tight text-brand-600 sm:text-2xl">${avgPct}%</p>
            <p className="text-[10.5px] font-semibold uppercase tracking-wide text-navy-400">Average</p>
          </div>
        </div>
        <${Button} variant="subtle" size="sm" className="mt-3 w-full sm:mt-4" onClick=${() => navigate("quizzes")}>
          Go to quizzes <${Icon} name="arrowRight" className="h-3.5 w-3.5" />
        </${Button}>
      </${Card}>
    </div>

    <div>
      <${SectionTitle} action=${html`<button onClick=${() => navigate("subjects")} className="text-[12px] font-bold text-brand-600 hover:text-brand-700 active:opacity-70">Browse all</button>`}>
        Continue learning
      </${SectionTitle}>
      ${continueItem ? html`<${Card} className="overflow-hidden">
        <div className="flex flex-col gap-3 p-4 sm:flex-row sm:items-center sm:gap-4 sm:p-5">
          <div className=${cx("grid h-12 w-12 shrink-0 place-items-center rounded-2xl bg-gradient-to-br text-white shadow-lg sm:h-14 sm:w-14", TINTS[continueItem.subject.tint].grad)}>
            <${Icon} name="play" className="h-5 w-5 sm:h-6 sm:w-6" strokeWidth=${2} filled=${true} />
          </div>
          <div className="min-w-0 flex-1">
            <div className="flex flex-wrap items-center gap-2">
              <${Badge} tone="brand">${continueItem.subject.name}</${Badge}>
              <span className="text-[11px] font-semibold text-navy-400">${continueItem.unit.title}</span>
            </div>
            <h3 className="mt-1 truncate text-[14px] font-extrabold text-navy-900 sm:mt-1.5 sm:text-[15px]">${continueItem.resource.title}</h3>
            <p className="mt-0.5 text-[11.5px] text-navy-500 sm:text-[12px]">Opened ${timeAgo(recent[0].at)} · ${continueItem.resource.minutes} min read</p>
          </div>
          <${Button} onClick=${() => openNote(continueItem.subject.id, continueItem.resource.id)} className="shrink-0">
            Resume <${Icon} name="arrowRight" className="h-4 w-4" />
          </${Button}>
        </div>
      </${Card}>` : html`<${EmptyState} icon="book" title="Nothing in progress yet"
        message="Open a note to start learning. Everything you read shows up here so you can jump straight back in."
        action=${html`<${Button} onClick=${() => navigate("subjects")}>Browse subjects <${Icon} name="arrowRight" className="h-4 w-4" /></${Button}>`} />`}
    </div>

    <div>
      <${SectionTitle}>Your subjects</${SectionTitle}>
      <div className="grid gap-2.5 sm:grid-cols-2 sm:gap-3">
        ${ALL_SUBJECTS.slice(0,6).map(s => {
          const prog = subjectProgress(s);
          const tint = TINTS[s.tint];
          return html`<button key=${s.id} onClick=${() => go("subject", { subjectId: s.id })}
            className="group rounded-2xl border border-navy-100 bg-white p-3.5 text-left shadow-soft transition hover:-translate-y-0.5 hover:border-navy-200 hover:shadow-lift active:translate-y-0 active:scale-[0.99] sm:p-4">
            <div className="flex items-start gap-3">
              <div className=${cx("grid h-10 w-10 shrink-0 place-items-center rounded-xl sm:h-11 sm:w-11", tint.bg, tint.text)}>
                <${Icon} name=${s.icon} className="h-5 w-5" />
              </div>
              <div className="min-w-0 flex-1">
                <p className="truncate text-[13.5px] font-extrabold text-navy-900 sm:text-[14px]">${s.name}</p>
                <p className="text-[10.5px] font-semibold uppercase tracking-wide text-navy-400">${s.code}</p>

    <div>
      <${SectionTitle} action=${html`<button onClick=${() => navigate("library")} className="text-[12px] font-bold text-brand-600 hover:text-brand-700 active:opacity-70">View library</button>`}>Recently opened</${SectionTitle}>
      ${recent.length === 0
        ? html`<${Card} className="p-5 text-center text-sm text-navy-500">Notes you open will appear here.</${Card}>`
        : html`<div className="space-y-2">
            ${recent.slice(0,3).map(item => {
              const found = findResource(item.subjectId, item.noteId);

              const tint = TINTS[found.subject.tint];

                  <p className="truncate text-[13px] font-bold text-navy-900 sm:text-[13.5px]">${found.resource.title}</p>

/* =========================================================
   Subjects
   ========================================================= */
function Subjects(){
  const { go, recent } = useApp();
  const [q, setQ] = useState("");
  const [filter, setFilter] = useState("all");

  const filtered = ALL_SUBJECTS.filter(s => {
    const matchesQ = (s.name + " " + s.code + " " + s.desc).toLowerCase().includes(q.trim().toLowerCase());
    const matchesFilter = filter === "all" || s.category === filter;
    return matchesQ && matchesFilter;
  });

  return html`<div className="anim-in space-y-5">
    <div>
      <h1 className="text-[22px] font-extrabold tracking-tight text-navy-900 sm:text-[26px]">Subjects</h1>
      <p className="mt-1 text-[13px] text-navy-500 sm:text-sm">Browse our full library of ${ALL_SUBJECTS.length} subjects.</p>
    </div>

    <div className="space-y-3">
      <div className="relative">
        <${Icon} name="search" className="pointer-events-none absolute left-4 top-1/2 h-5 w-5 -translate-y-1/2 text-navy-400" />
        <input value=${q} onInput=${e => setQ(e.target.value)} placeholder="Filter subjects…" aria-label="Filter subjects"
          className="w-full rounded-2xl border border-navy-200 bg-white py-3.5 pl-12 pr-4 text-sm shadow-soft outline-none transition focus:border-brand-500 focus:ring-4 focus:ring-brand-500/12" />
      </div>
      
      <div className="no-scrollbar flex gap-2 overflow-x-auto pb-1">
        ${[
          { id:"all", label:"All" },
          { id:"engineering", label:"Engineering" },
          { id:"professional", label:"Professional" }
        ].map(f => html`<button key=${f.id} onClick=${() => setFilter(f.id)}
          className=${cx("shrink-0 rounded-full px-3.5 py-1.5 text-[12px] font-bold transition active:scale-95",
            filter === f.id ? "bg-navy-900 text-white" : "bg-white text-navy-600 border border-navy-200 hover:bg-navy-50")}>
          ${f.label}
        </button>`)}
      </div>
    </div>

    ${filtered.length === 0
      ? html`<${EmptyState} icon="search" title="No subjects match that" message="Try a different search term or filter."
          action=${html`<${Button} variant="outline" onClick=${() => { setQ(""); setFilter("all"); }}>Clear filters</${Button}>`} />`
      : html`<div className="space-y-3">
          ${filtered.map(s => {
            const tint = TINTS[s.tint];
            const total = s.units.reduce((a,u) => a + u.resources.length, 0);
            const opened = Math.min(recent.filter(r => r.subjectId === s.id).length, total);
            return html`<${Card} key=${s.id} className="overflow-hidden">
              <button onClick=${() => go("subject", { subjectId: s.id })}
                className="w-full p-4 text-left transition hover:bg-navy-50/40 active:bg-navy-100/60 sm:p-5">
                <div className="flex items-start gap-3 sm:gap-4">
                  <div className=${cx("grid h-11 w-11 shrink-0 place-items-center rounded-2xl bg-gradient-to-br text-white shadow-lg sm:h-12 sm:w-12", tint.grad)}>
                    <${Icon} name=${s.icon} className="h-5 w-5 sm:h-6 sm:w-6" />
                  </div>
                  <div className="min-w-0 flex-1">
                    <div className="flex flex-wrap items-center gap-2">
                      <h2 className="truncate text-[14.5px] font-extrabold text-navy-900 sm:text-[15.5px]">${s.name}</h2>
                      <${Badge} tone="navy">${s.code}</${Badge}>
                    </div>
                    <p className="mt-1 text-[12.5px] leading-5 text-navy-500 sm:text-[13px]">${s.desc}</p>
                    <div className="mt-2 flex flex-wrap items-center gap-x-3 gap-y-1 text-[11px] font-semibold text-navy-400 sm:text-[11.5px]">
                      <span className="inline-flex items-center gap-1"><${Icon} name="file" className="h-3.5 w-3.5" />${total} resources</span>
                      <span className="inline-flex items-center gap-1"><${Icon} name="grid" className="h-3.5 w-3.5" />${s.units.length} unit</span>
                      <span className="inline-flex items-center gap-1"><${Icon} name="check" className="h-3.5 w-3.5" />${opened} opened</span>
                    </div>
                  </div>
                  <${Icon} name="chevronRight" className="mt-1 h-5 w-5 shrink-0 text-navy-300" />
                </div>
              </button>
            </${Card}>`;
          })}
        </div>`}
  </div>`;
}

/* =========================================================
   Subject detail

function NoteReader(){
  const { params, go, back, bookmarks, toggleBookmark, toast, premium } = useApp();
  const found = findResource(params.subjectId, params.noteId);

  if(!found){
    return html`<${EmptyState} icon="info" title="Note not available"
      message="We could not load this note. It may have been removed from the demo library."
      action=${html`<${Button} onClick=${() => go("subjects")}>Back to subjects</${Button}>`} />`;
  }

  const { subject, unit, resource } = found;
  const saved = bookmarks.includes(KEY(subject.id, resource.id));
  const tint = TINTS[subject.tint];

  const download = () => {
    const lines = [
      "StudySmart — Demo Note",
      "======================",
      subject.name + " (" + subject.code + ")",
      unit.title, resource.title,
      resource.minutes + " min read · " + resource.type,
      "",
      ...resource.content.flatMap(b => {
        if(b.t === "h") return ["", b.text.toUpperCase(), ""];
        if(b.t === "p") return [b.text, ""];
        if(b.t === "list") return b.items.map(i => "  • " + i).concat([""]);
        if(b.t === "formula") return ["  " + b.text, ""];
        if(b.t === "note") return ["  > " + b.text, ""];
        return [];
      }),
      "",
      "Demonstration content created for the StudySmart prototype."
    ];
    const blob = new Blob([lines.join("\n")], { type:"text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = resource.title.replace(/[^a-z0-9]+/gi, "-").toLowerCase() + "-studysmart.txt";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast("Demo note downloaded as a text file");
  };

  return html`<div className="anim-in pb-4">
    <button onClick=${back}
      className="inline-flex items-center gap-1.5 text-sm font-semibold text-navy-500 transition hover:text-navy-800 active:opacity-70">
      <${Icon} name="chevronLeft" className="h-4 w-4" /> Back
    </button>

    <div className="mt-3 flex flex-wrap items-center gap-2">
      <${Badge} tone="brand">${subject.name}</${Badge}>
      <span className="text-[11px] font-semibold text-navy-400 sm:text-[11.5px]">${unit.title}</span>
      ${resource.free ? html`<${Badge} tone="green">Free</${Badge}>` : html`<${Badge} tone="gold"><${Icon} name="crown" className="h-3 w-3" />Premium</${Badge}>`}
    </div>

    <h1 className="mt-2 text-[20px] font-extrabold leading-tight tracking-tight text-navy-900 sm:text-[24px]">${resource.title}</h1>
    <div className="mt-2 flex flex-wrap items-center gap-x-4 gap-y-1 text-[11.5px] font-semibold text-navy-400 sm:text-[12px]">
      <span className="inline-flex items-center gap-1"><${Icon} name="file" className="h-3.5 w-3.5" />${resource.type}</span>
      <span className="inline-flex items-center gap-1"><${Icon} name="clock" className="h-3.5 w-3.5" />${resource.minutes} min read</span>
      <span className="inline-flex items-center gap-1"><${Icon} name="check" className="h-3.5 w-3.5" />Demo content</span>
    </div>

    <div className="mt-4 flex flex-wrap gap-2">
      <${Button} variant=${saved ? "subtle" : "outline"} size="sm" onClick=${() => toggleBookmark(subject.id, resource.id)} className="flex-1">
        <${Icon} name="bookmark" className="h-4 w-4" filled=${saved} strokeWidth=${saved ? 1 : 1.8} />
        ${saved ? "Bookmarked" : "Bookmark"}
      </${Button}>
      ${resource.has3D && (resource.free || premium) ? html`
        <${Button} variant="outline" size="sm" className="flex-1 border-violet-200 text-violet-700 bg-violet-50 hover:bg-violet-100" onClick=${() => go("3d-model", { subjectId: subject.id, noteId: resource.id, title: resource.title })}>
          <${Icon} name="cube" className="h-4 w-4" /> 3D Study
        </${Button}>
      ` : null}
      <${Button} variant="outline" size="sm" onClick=${download} className="flex-1">
        <${Icon} name="download" className="h-4 w-4" /> Download
      </${Button}>
    </div>

    <${Card} className="mt-4 p-4 sm:mt-5 sm:p-7">
      ${resource.content.map((b, i) => {
        if(b.t === "h") return html`<h3 key=${i} className="mb-2 mt-5 text-[14.5px] font-extrabold text-navy-900 first:mt-0 sm:mt-6 sm:text-[15.5px]">${b.text}</h3>`;
        if(b.t === "p") return html`<p key=${i} className="mb-3 text-[13.5px] leading-6 text-navy-700 sm:text-[14.5px] sm:leading-7">${b.text}</p>`;
        if(b.t === "list") return html`<ul key=${i} className="mb-4 space-y-2">
          ${b.items.map((it, j) => html`<li key=${j} className="flex gap-2.5 text-[13.5px] leading-6 text-navy-700 sm:text-[14.5px] sm:leading-7">
            <span className="mt-2 h-1.5 w-1.5 shrink-0 rounded-full bg-brand-400"></span>
            <span>${it}</span>
          </li>`)}
        </ul>`;
        if(b.t === "formula") return html`<div key=${i} className="mb-3.5 whitespace-pre-line overflow-x-auto rounded-xl border border-brand-100 bg-brand-50/70 px-3 py-2.5 font-mono text-[12px] leading-6 text-navy-900 sm:px-4 sm:py-3 sm:text-[13px]">${b.text}</div>`;
        if(b.t === "note") return html`<div key=${i} className="mb-3.5 flex gap-2.5 rounded-xl border border-violet-200 bg-violet-50 p-3 sm:mb-4 sm:p-3.5">
          <${Icon} name="info" className="mt-0.5 h-4 w-4 shrink-0 text-violet-500" />
          <p className="text-[12.5px] leading-5 text-violet-900 sm:text-[13px] sm:leading-6">${b.text}</p>
        </div>`;
        return null;
      })}
    </${Card}>

    <${Card} className="mt-3 flex items-center gap-3 p-3.5 sm:mt-4 sm:p-4">
      <div className=${cx("grid h-10 w-10 shrink-0 place-items-center rounded-xl", tint.bg, tint.text)}>
        <${Icon} name="help" className="h-5 w-5" />
      </div>
      <div className="min-w-0 flex-1">
        <p className="text-[13px] font-bold text-navy-900 sm:text-[13.5px]">Ready to test yourself?</p>
        <p className="text-[11px] text-navy-500 sm:text-[11.5px]">MCQs on ${subject.name} · instant feedback</p>
      </div>
      <${Button} size="sm" onClick=${() => go("quiz", { subjectId: subject.id })}>Start quiz</${Button}>
    </${Card}>

    ${!premium ? html`<button onClick=${() => go("premium")}
      className="mt-3 w-full rounded-2xl border border-amber-200 bg-gradient-to-r from-amber-50 to-orange-50 p-3.5 text-left transition hover:brightness-[0.98] active:scale-[0.99] sm:mt-4 sm:p-4">
      <div className="flex items-center gap-3">
        <div className="grid h-9 w-9 shrink-0 place-items-center rounded-xl bg-gradient-to-br from-amber-400 to-orange-500 text-white">
          <${Icon} name="crown" className="h-4 w-4" />
        </div>
        <div className="min-w-0 flex-1">
          <p className="text-[12.5px] font-extrabold text-navy-900 sm:text-[13px]">Unlock every note & practice pack</p>
          <p className="text-[11px] text-navy-500 sm:text-[11.5px]">StudySmart Premium · ₹49/month (proposal)</p>
        </div>
        <${Icon} name="arrowRight" className="h-4 w-4 shrink-0 text-navy-400" />
      </div>
    </button>` : null}
  </div>`;
}

function QuizPlayer(){
  const { params, go, saveResult, back } = useApp();
  const quiz = QUIZZES[params.subjectId];
  const subject = findSubject(params.subjectId);
  const [index, setIndex] = useState(0);
  const [answers, setAnswers] = useState(() => (quiz ? quiz.questions.map(() => null) : []));
  const [confirmSubmit, setConfirmSubmit] = useState(false);

  if(!quiz || !subject){
    return html`<${EmptyState} icon="info" title="Quiz unavailable"
      message="This quiz is not part of the demo library."
      action=${html`<${Button} onClick=${() => go("quizzes")}>Back to quizzes</${Button}>`} />`;
  }

  const total = quiz.questions.length;
  const question = quiz.questions[index];
  const answered = answers.filter(a => a !== null).length;
  const isLast = index === total - 1;
  const progress = Math.round(((index + 1) / total) * 100);

  const select = (optIdx) => {
    setAnswers(prev => prev.map((a, i) => (i === index ? optIdx : a)));
  };

  const submit = () => {
    const score = quiz.questions.reduce((acc, q, i) => acc + (answers[i] === q.answer ? 1 : 0), 0);
    saveResult(params.subjectId, { score, total, answers, at: Date.now() });
    go("quizResult", { subjectId: params.subjectId });
  };

  return html`<div className="anim-in">
    <div className="flex items-center justify-between">
      <button onClick=${back}
        className="inline-flex items-center gap-1.5 text-sm font-semibold text-navy-500 transition hover:text-navy-800 active:opacity-70">
        <${Icon} name="chevronLeft" className="h-4 w-4" /> Exit
      </button>
      <${Badge} tone="brand">Q ${index + 1} of ${total}</${Badge}>
    </div>

    <div className="mt-3 h-1.5 overflow-hidden rounded-full bg-navy-100 sm:mt-4">
      <div className="h-full rounded-full bg-gradient-to-r from-brand-500 to-violet-500 transition-all duration-300" style=${{ width: progress + "%" }}></div>
    </div>

    <${Card} className="mt-4 p-4 sm:mt-5 sm:p-7">
      <p className="text-[10.5px] font-bold uppercase tracking-widest text-brand-600 sm:text-[11px]">${subject.name} · Quiz</p>
      <h2 className="mt-2 whitespace-pre-line text-[15px] font-extrabold leading-6 text-navy-900 sm:text-[17px] sm:leading-7">${question.q}</h2>
      <div className="mt-4 space-y-2 sm:mt-5 sm:space-y-2.5">
        ${question.options.map((opt, i) => {
          const selected = answers[index] === i;
          return html`<button key=${i} onClick=${() => select(i)} aria-pressed=${selected}
            className=${cx("flex w-full items-center gap-3 rounded-xl border-2 px-3 py-3 text-left transition-all duration-150 active:scale-[0.995] sm:px-4 sm:py-3.5",

            <span className=${cx("grid h-7 w-7 shrink-0 place-items-center rounded-lg text-[12px] font-extrabold transition",
              selected ? "bg-brand-600 text-white" : "bg-navy-100 text-navy-500")}>
              ${selected ? html`<${Icon} name="check" className="h-3.5 w-3.5" strokeWidth=${3} />` : String.fromCharCode(65 + i)}
            </span>
            <span className=${cx("text-[13.5px] leading-5 sm:text-[14px] sm:leading-6", selected ? "font-bold text-navy-900" : "font-medium text-navy-700")}>${opt}</span>
          </button>`;
        })}

/* =========================================================
   Quiz result
   ========================================================= */
function QuizResult(){
  const { params, results, go } = useApp();
  const quiz = QUIZZES[params.subjectId];
  const subject = findSubject(params.subjectId);
  const result = results[params.subjectId];

  if(!quiz || !subject || !result){
    return html`<${EmptyState} icon="info" title="No result to show"
      message="Attempt a quiz to see your score and explanations here."
      action=${html`<${Button} onClick=${() => go("quizzes")}>Go to quizzes</${Button}>`} />`;
  }

  const pct = Math.round((result.score / result.total) * 100);
  const verdict = pct >= 80 ? "Excellent work" : pct >= 60 ? "Good effort" : "Keep practising";

  return html`<div className="anim-in space-y-4 sm:space-y-5">
    <button onClick=${() => go("quizzes")}
      className="inline-flex items-center gap-1.5 text-sm font-semibold text-navy-500 transition hover:text-navy-800 active:opacity-70">
      <${Icon} name="chevronLeft" className="h-4 w-4" /> All quizzes
    </button>

    <${Card} className="overflow-hidden">
      <div className="relative bg-navy-900 p-5 text-center text-white sm:p-6">
        <div className="pointer-events-none absolute -left-10 -top-10 h-40 w-40 rounded-full bg-brand-500/25 blur-2xl"></div>
        <div className="pointer-events-none absolute -right-10 bottom-0 h-40 w-40 rounded-full bg-violet-500/20 blur-2xl"></div>
        <div className="relative">
          <p className="text-[10.5px] font-bold uppercase tracking-widest text-navy-300 sm:text-[11px]">${quiz.title}</p>
          <div className="mt-3 flex justify-center sm:mt-4">
            <${ProgressRing} value=${pct} size=${124} stroke=${11} trackClass="text-white/15">
              <span className="text-2xl font-extrabold tracking-tight sm:text-3xl">${pct}%</span>
              <span className="text-[9.5px] font-bold uppercase tracking-widest text-navy-300 sm:text-[10px]">score</span>
            </${ProgressRing}>
          </div>
          <h1 className="mt-3 text-lg font-extrabold tracking-tight sm:mt-4 sm:text-xl">${verdict}!</h1>
          <p className="mt-1 text-[12.5px] text-navy-300 sm:text-[13px]">You answered ${result.score} of ${result.total} correctly.</p>
        </div>
      </div>
      <div className="grid grid-cols-3 divide-x divide-navy-100">
        ${[
          { label:"Correct", value:result.score, tone:"text-emerald-600" },
          { label:"Incorrect", value:result.total - result.score, tone:"text-rose-600" },
          { label:"Percentage", value:pct + "%", tone:"text-brand-600" }
        ].map(s => html`<div key=${s.label} className="px-2 py-3 text-center sm:py-4">
          <p className=${cx("text-base font-extrabold tracking-tight sm:text-lg", s.tone)}>${s.value}</p>
          <p className="text-[10px] font-bold uppercase tracking-wide text-navy-400 sm:text-[10.5px]">${s.label}</p>
        </div>`)}
      </div>
    </${Card}>

    <div className="flex gap-2">
      <${Button} variant="primary" className="flex-1" onClick=${() => go("quiz", { subjectId: subject.id })}>
        <${Icon} name="refresh" className="h-4 w-4" /> Retake
      </${Button}>
      <${Button} variant="outline" className="flex-1" onClick=${() => go("quizzes")}>Back</${Button}>
    </div>

    <div>
      <${SectionTitle}>Answer review</${SectionTitle}>
      <div className="space-y-2.5">
        ${quiz.questions.map((q, i) => {
          const chosen = result.answers[i];
          const correct = chosen === q.answer;
          return html`<${Card} key=${i} className="p-3.5 sm:p-4">
            <div className="flex items-start gap-3">
              <span className=${cx("grid h-6 w-6 shrink-0 place-items-center rounded-full text-white", correct ? "bg-emerald-500" : "bg-rose-500")}>
                <${Icon} name=${correct ? "check" : "x"} className="h-3.5 w-3.5" strokeWidth=${3} />
              </span>
              <div className="min-w-0 flex-1">
                <p className="text-[13px] font-bold leading-5 text-navy-900 sm:text-[13.5px] sm:leading-6">${i + 1}. ${q.q}</p>
                <div className="mt-2 space-y-1.5">
                  <div className=${cx("rounded-lg px-2.5 py-2 text-[12px] leading-5 sm:px-3 sm:text-[12.5px]",
                    correct ? "bg-emerald-50 text-emerald-800" : "bg-rose-50 text-rose-800")}>
                    <span className="font-bold">Your answer: </span>
                    ${chosen === null || chosen === undefined ? "Not answered" : q.options[chosen]}
                  </div>
                  ${!correct ? html`<div className="rounded-lg bg-emerald-50 px-2.5 py-2 text-[12px] leading-5 text-emerald-800 sm:px-3 sm:text-[12.5px]">
                    <span className="font-bold">Correct: </span>${q.options[q.answer]}
                  </div>` : null}
                </div>
                <div className="mt-2 flex gap-2 rounded-lg bg-navy-50 px-2.5 py-2 sm:px-3">
                  <${Icon} name="info" className="mt-0.5 h-3.5 w-3.5 shrink-0 text-navy-400" />

                </div>
              </div>
            </div>
          </${Card}>`;
        })}
      </div>
    </div>
  </div>`;
}

function Profile(){

  const [email, setEmail] = useState(user.email);

  const [goal, setGoal] = useState(prefs.dailyGoal);
  const [notifications, setNotifications] = useState(prefs.notifications);
  const [reminder, setReminder] = useState(prefs.reminder);
  const [confirmLogout, setConfirmLogout] = useState(false);
  const [confirmReset, setConfirmReset] = useState(false);

  const resultList = Object.values(results);
  const avg = resultList.length ? Math.round(resultList.reduce((a,r) => a + (r.score/r.total)*100, 0) / resultList.length) : 0;

    if(!name.trim()){ toast("Name cannot be empty", "error"); return; }

        <span className=${cx("grid h-8 w-8 place-items-center rounded-lg", s.tone)}>

      </${Card}>`)}
    </div>

    ${resultList.length > 0 ? html`<div>
      <${SectionTitle}>Recent quiz scores</${SectionTitle}>
      <${Card} className="divide-y divide-navy-100">
        ${Object.entries(results).map(([sid, r]) => {
          const s = findSubject(sid);

          return html`<button key=${sid} onClick=${() => go("quizResult", { subjectId: sid })}
            className="flex w-full items-center gap-3 px-3.5 py-3 text-left transition hover:bg-navy-50/60 active:bg-navy-100/60 sm:px-4">

              <p className="truncate text-[12.5px] font-bold text-navy-900 sm:text-[13px]">${s ? s.name : sid}</p>
              <p className="text-[11px] text-navy-500">${r.score}/${r.total} correct · ${timeAgo(r.at)}</p>
            </div>
            <span className=${cx("text-[12.5px] font-extrabold sm:text-[13px]", pct >= 60 ? "text-emerald-600" : "text-rose-600")}>${pct}%</span>
          </button>`;
        })}
      </${Card}>
    </div>` : null}

    <div>
      <${SectionTitle}>Demo preferences</${SectionTitle}>
      <${Card} className="space-y-3.5 p-4 sm:space-y-4 sm:p-5">
        <div className="grid gap-3 sm:grid-cols-2 sm:gap-4">
          <div>
            <label htmlFor="p-name" className="mb-1.5 block text-[12.5px] font-bold text-navy-700 sm:text-[13px]">Display name</label>
            <input id="p-name" value=${name} onInput=${e => setName(e.target.value)}
              className="w-full rounded-xl border border-navy-200 px-3.5 py-2.5 text-sm outline-none transition focus:border-brand-500 focus:ring-4 focus:ring-brand-500/15" />

          <div>
            <label htmlFor="p-email" className="mb-1.5 block text-[12.5px] font-bold text-navy-700 sm:text-[13px]">Email</label>
            <input id="p-email" type="email" value=${email} onInput=${e => setEmail(e.target.value)}

          </div>
          <div>
            <label htmlFor="p-branch" className="mb-1.5 block text-[12.5px] font-bold text-navy-700 sm:text-[13px]">Branch</label>
            <input id="p-branch" value=${branch} onInput=${e => setBranch(e.target.value)}
              className="w-full rounded-xl border border-navy-200 px-3.5 py-2.5 text-sm outline-none transition focus:border-brand-500 focus:ring-4 focus:ring-brand-500/15" />

          <div>
            <label htmlFor="p-goal" className="mb-1.5 block text-[12.5px] font-bold text-navy-700 sm:text-[13px]">Daily goal (min)</label>
            <input id="p-goal" type="number" min="5" max="240" value=${goal} onInput=${e => setGoal(e.target.value)}

        <div className="flex items-center justify-between rounded-xl border border-navy-100 bg-navy-50/60 px-3 py-2.5 sm:px-3.5 sm:py-3">

            <${Icon} name="bell" className="h-4 w-4 text-navy-400" />
            <div>
              <p className="text-[12.5px] font-bold text-navy-800 sm:text-[13px]">Study reminders</p>
              <p className="text-[10.5px] text-navy-500 sm:text-[11px]">A gentle nudge at your preferred time</p>

            className="w-full rounded-xl border border-navy-200 px-3.5 py-2.5 text-sm outline-none transition focus:border-brand-500 focus:ring-4 focus:ring-brand-500/15 disabled:bg-navy-50 disabled:text-navy-400 sm:w-56" />

        </${Button}>

    <div className="space-y-2.5">
      <${Button} variant="outline" className="w-full justify-start" onClick=${() => go("premium")}>
        <${Icon} name="crown" className="h-4 w-4 text-amber-500" />
        ${premium ? "Manage membership" : "Upgrade to Premium"}
        <${Icon} name="chevronRight" className="ml-auto h-4 w-4 text-navy-300" />
      </${Button}>
      <${Button} variant="outline" className="w-full justify-start" onClick=${() => setConfirmReset(true)}>
        <${Icon} name="refresh" className="h-4 w-4 text-navy-400" />

      </${Button}>
      <${Button} variant="danger" className="w-full justify-start" onClick=${() => setConfirmLogout(true)}>
        <${Icon} name="logout" className="h-4 w-4" />

      </${Button}>
    </div>

    <div className="pb-2 text-center">
      <p className="text-[10px] font-extrabold uppercase tracking-widest text-navy-500">Created by GROUP 1D</p>
      <p className="mt-1.5 text-[10.5px] leading-5 text-navy-400">
        StudySmart prototype · Demo data stored locally in this browser.<br />
        No accounts, payments or university affiliations are real.
      </p>
    </div>

    <${Modal} open=${confirmLogout} onClose=${() => setConfirmLogout(false)}>
      <div className="grid h-12 w-12 place-items-center rounded-2xl bg-rose-50 text-rose-500">
        <${Icon} name="logout" className="h-6 w-6" />
      </div>
      <h3 className="mt-4 text-lg font-extrabold tracking-tight text-navy-900">Log out of StudySmart?</h3>
      <p className="mt-1.5 text-[13px] leading-6 text-navy-500 sm:text-[13.5px]">
        Your bookmarks and progress stay saved in this browser. You can sign back in any time.
      </p>
      <div className="mt-5 flex gap-2">
        <${Button} variant="outline" className="flex-1" onClick=${() => setConfirmLogout(false)}>Cancel</${Button}>
        <${Button} variant="primary" className="flex-1" onClick=${() => { setConfirmLogout(false); signOut(); }}>Log out</${Button}>
      </div>
    </${Modal}>

    <${Modal} open=${confirmReset} onClose=${() => setConfirmReset(false)}>
      <div className="grid h-12 w-12 place-items-center rounded-2xl bg-navy-100 text-navy-600">
        <${Icon} name="refresh" className="h-6 w-6" />
      </div>
      <h3 className="mt-4 text-lg font-extrabold tracking-tight text-navy-900">Reset demo data?</h3>
      <p className="mt-1.5 text-[13px] leading-6 text-navy-500 sm:text-[13.5px]">
        This clears bookmarks, quiz results and preferences, then restarts the prototype from the welcome screen.
      </p>
      <div className="mt-5 flex gap-2">
        <${Button} variant="outline" className="flex-1" onClick=${() => setConfirmReset(false)}>Cancel</${Button}>
        <${Button} variant="primary" className="flex-1" onClick=${resetDemo}>Reset now</${Button}>
      </div>
    </${Modal}>
  </div>`;
}

/* =========================================================
   Shell
   ========================================================= */
const NAV = [
  { id:"dashboard", label:"Home", icon:"home" },
  { id:"subjects", label:"Subjects", icon:"grid" },
  { id:"quizzes", label:"Quizzes", icon:"help" },
  { id:"library", label:"My Library", icon:"bookmark" },
  { id:"profile", label:"Profile", icon:"user" }
];

function Shell({ children, activeId }){
  const { navigate, premium, user, screen, back, go } = useApp();
  const initials = (user.name || "Deepak Sharma").split(" ").map(w => w[0]).slice(0, 2).join("").toUpperCase();
  
  // Determine if we are on a root screen (bottom nav) or a sub-screen
  const rootScreens = ["dashboard", "subjects", "quizzes", "library", "profile"];
  const isSubScreen = !rootScreens.includes(screen);

  return html`<div className="min-h-screen bg-navy-50 relative">
    <aside className="fixed inset-y-0 left-0 z-40 hidden w-64 flex-col border-r border-white/5 bg-navy-950 lg:flex">
      <div className="px-5 py-6">
        <button onClick=${() => navigate("dashboard")} aria-label="StudySmart home" className="transition active:opacity-70">
          <${Logo} dark=${true} />
        </button>
      </div>
      <nav className="flex-1 space-y-1 px-3">
        ${NAV.map(item => {
          const active = activeId === item.id;
          return html`<button key=${item.id} onClick=${() => navigate(item.id)}
            aria-current=${active ? "page" : undefined}
            className=${cx("flex w-full items-center gap-3 rounded-xl px-3.5 py-3 text-[13.5px] font-bold transition active:scale-[0.98]",
              active ? "bg-white/10 text-white shadow-inner" : "text-navy-300 hover:bg-white/5 hover:text-white")}>
            <${Icon} name=${item.icon} className=${cx("h-[18px] w-[18px]", active && "text-brand-300")} />
            ${item.label}
            ${active ? html`<span className="ml-auto h-1.5 w-1.5 rounded-full bg-brand-400"></span>` : null}
          </button>`;
        })}
      </nav>
      <div className="p-3">
        ${!premium ? html`<button onClick=${() => navigate("premium")}
          className="w-full rounded-2xl bg-gradient-to-br from-brand-600 to-violet-600 p-4 text-left transition hover:brightness-110 active:scale-[0.98]">
          <div className="flex items-center gap-2">
            <${Icon} name="crown" className="h-4 w-4 text-amber-200" />
            <span className="text-[11px] font-extrabold uppercase tracking-wider text-white/80">Premium</span>
          </div>
          <p className="mt-1.5 text-[13px] font-extrabold leading-snug text-white">Unlock all notes & quizzes</p>
          <p className="mt-0.5 text-[11px] font-semibold text-white/70">₹49/month · proposal</p>
        </button>` : null}
        <button onClick=${() => navigate("profile")} className="mt-3 flex w-full items-center gap-2.5 rounded-xl px-2 py-2 text-left transition hover:bg-white/5 active:scale-[0.98]">
          <span className="grid h-8 w-8 shrink-0 place-items-center rounded-lg bg-brand-500/20 text-[11px] font-extrabold text-brand-200">${initials}</span>
          <span className="min-w-0 flex-1">
            <span className="block truncate text-[12.5px] font-bold text-white">${user.name}</span>
            <span className="block truncate text-[10.5px] text-navy-400">${user.branch}</span>
          </span>
        </button>
        <p className="mt-3 text-center text-[9.5px] font-semibold uppercase tracking-widest text-navy-500">Created by GROUP 1D</p>
      </div>
    </aside>

    <header className="sticky top-0 z-30 border-b border-navy-100 bg-white/85 backdrop-blur-md lg:hidden">
      <div className="flex items-center justify-between px-3 py-2.5 sm:px-4 sm:py-3">
        <div className="flex items-center gap-2">
          ${isSubScreen ? html`
            <button onClick=${back} aria-label="Go back" className="grid h-10 w-10 place-items-center rounded-xl bg-navy-50 text-navy-600 transition hover:bg-navy-100 active:scale-95">
              <${Icon} name="chevronLeft" className="h-5 w-5" strokeWidth=${2.5} />
            </button>
          ` : null}
          <button onClick=${() => navigate("dashboard")} aria-label="StudySmart home" className="transition active:opacity-70">
            <${Logo} />
          </button>
        </div>
        <div className="flex items-center gap-1.5">
          <button onClick=${() => navigate("premium")} aria-label="Premium membership"
            className=${cx("grid h-10 w-10 place-items-center rounded-xl transition active:scale-95",
              premium ? "bg-amber-50 text-amber-600" : "bg-navy-50 text-navy-500 hover:bg-navy-100")}>
            <${Icon} name="crown" className="h-[18px] w-[18px]" />
          </button>
          <button onClick=${() => navigate("profile")} aria-label="Profile"
            className="grid h-10 w-10 place-items-center rounded-xl bg-navy-900 text-[11px] font-extrabold text-white transition active:scale-95">${initials}</button>
        </div>
      </div>
    </header>

    <main className="lg:pl-64">
      <div className="mx-auto w-full max-w-3xl px-3.5 pb-28 pt-4 sm:px-6 sm:pt-5 lg:max-w-4xl lg:pb-14 lg:pt-8">
        ${children}
      </div>
    </main>

    <!-- Floating AI Button -->
    ${screen !== "ai" ? html`
      <button onClick=${() => go("ai")} 
        className="fixed bottom-20 right-4 sm:bottom-24 sm:right-6 z-50 grid h-14 w-14 place-items-center rounded-full bg-gradient-to-r from-brand-600 to-violet-600 text-white shadow-xl shadow-brand-600/40 transition-transform hover:scale-110 active:scale-95 lg:bottom-8 lg:right-8"
        aria-label="Open StudySmart AI">
        <${Icon} name="sparkles" className="h-6 w-6" />
      </button>
    ` : null}

    <nav className="fixed inset-x-0 bottom-0 z-40 border-t border-navy-100 bg-white/95 backdrop-blur-md safe-bottom lg:hidden" aria-label="Primary">
      <div className="mx-auto flex max-w-lg items-stretch justify-between px-1">
        ${NAV.map(item => {
          const active = activeId === item.id;
          return html`<button key=${item.id} onClick=${() => navigate(item.id)}
            aria-current=${active ? "page" : undefined} aria-label=${item.label}
            className="relative flex flex-1 flex-col items-center gap-0.5 px-0.5 py-2 transition active:scale-95">
            <span className=${cx("grid h-8 w-11 place-items-center rounded-lg transition-all",
              active ? "bg-brand-50 text-brand-600" : "text-navy-400")}>
              <${Icon} name=${item.icon} className="h-[19px] w-[19px]" strokeWidth=${active ? 2.2 : 1.8} />
            </span>
            <span className=${cx("text-[10px] font-bold leading-none", active ? "text-brand-700" : "text-navy-400")}>
              ${item.label}
            </span>
          </button>`;
        })}
      </div>
    </nav>
  </div>`;
}

function ToastStack({ toasts }){
  return html`<div className="pointer-events-none fixed inset-x-0 top-3 z-[90] flex flex-col items-center gap-2 px-3 sm:top-5 sm:px-4">
    ${toasts.map(t => html`<div key=${t.id}
      className=${cx("anim-pop pointer-events-auto flex w-full max-w-sm items-center gap-2.5 rounded-xl px-4 py-3 text-[13px] font-semibold shadow-lift",
        t.kind === "error" ? "bg-rose-600 text-white" : t.kind === "info" ? "bg-navy-900 text-white" : "bg-emerald-600 text-white")}>
      <${Icon} name=${t.kind === "error" ? "x" : t.kind === "info" ? "info" : "check"} className="h-4 w-4 shrink-0" strokeWidth=${2.6} />
      <span className="flex-1">${t.msg}</span>
    </div>`)}
  </div>`;
}

/* =========================================================
   Root App
   ========================================================= */
function App(){
  const [loggedIn, setLoggedIn] = useLocalStorage("ss_logged", false);
  const [user, setUser] = useLocalStorage("ss_user", { name:"Deepak Sharma", email:"deepak@studysmart.demo", branch:"B.Tech · First Year" });
  const [prefs, setPrefs] = useLocalStorage("ss_prefs", { dailyGoal:30, notifications:true, reminder:"19:00" });
  const [bookmarks, setBookmarks] = useLocalStorage("ss_bookmarks", []);
  const [recent, setRecent] = useLocalStorage("ss_recent", []);
  const [results, setResults] = useLocalStorage("ss_results", {});
  const [premium, setPremium] = useLocalStorage("ss_premium", false);

  const [screen, setScreen] = useState(loggedIn ? "dashboard" : "welcome");
  const [params, setParams] = useState({});
  const [toasts, setToasts] = useState([]);
  const initialised = useRef(false);

  useEffect(() => {
    const start = window.__splashStart || Date.now();
    const minDur = window.__splashMinMs || 2000;
    const wait = Math.max(0, minDur - (Date.now() - start));
    const t1 = setTimeout(() => {
      const boot = document.getElementById("boot");
      if(boot){
        boot.classList.add("hide");
        document.body.classList.add("app-ready");
        setTimeout(() => { boot.style.display = "none"; }, 650);
      }
    }, wait);
    return () => clearTimeout(t1);
  }, []);

  const scrollTop = () => { try { window.scrollTo(0, 0); } catch(e){} };

  useEffect(() => {
    if(initialised.current) return;
    initialised.current = true;
    try { window.history.replaceState({ ssScreen: screen, ssParams: params }, ""); } catch(e){}
  }, []);

  useEffect(() => {
    const onPop = (e) => {
      if(e.state && e.state.ssScreen){
        setScreen(e.state.ssScreen);
        setParams(e.state.ssParams || {});
      } else {
        setScreen(loggedIn ? "dashboard" : "welcome");
        setParams({});
      }
      scrollTop();
    };
    window.addEventListener("popstate", onPop);
    return () => window.removeEventListener("popstate", onPop);
  }, [loggedIn]);

  const pushHistory = (scr, p) => {
    try { window.history.pushState({ ssScreen: scr, ssParams: p }, ""); } catch(e){}
  };
  const replaceHistory = (scr, p) => {
    try { window.history.replaceState({ ssScreen: scr, ssParams: p }, ""); } catch(e){}
  };

  const toast = (msg, kind = "success") => {
    const id = Date.now() + Math.random();
    setToasts(t => [...t, { id, msg, kind }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 2800);
  };

  const go = (next, nextParams = {}) => {
    pushHistory(next, nextParams);
    setScreen(next); setParams(nextParams); scrollTop();
  };

  const navigate = (next, nextParams = {}) => {
    replaceHistory(next, nextParams);
    setScreen(next); setParams(nextParams); scrollTop();
  };

  const back = () => {
    try { window.history.back(); } catch(e){ navigate("dashboard"); }
  };

  const signIn = (next = "dashboard") => {
    setLoggedIn(true);
    replaceHistory(next, {});
    setScreen(next); setParams({}); scrollTop();
  };

  const signOut = () => {
    setLoggedIn(false);
    replaceHistory("welcome", {});
    setScreen("welcome"); setParams({}); scrollTop();
    toast("Logged out — see you soon!", "info");
  };

  const toggleBookmark = (subjectId, noteId) => {
    const k = KEY(subjectId, noteId);
    setBookmarks(prev => {
      const has = prev.includes(k);
      toast(has ? "Removed from your library" : "Saved to your library", has ? "info" : "success");
      return has ? prev.filter(x => x !== k) : [...prev, k];
    });
  };

  const openNote = (subjectId, noteId) => {
    const found = findResource(subjectId, noteId);
    if(!found){ toast("That note could not be found", "error"); return; }
    if(!found.resource.free && !premium){
      toast("This note is part of StudySmart Premium", "info");
      go("premium"); return;
    }
    setRecent(prev => [
      { subjectId, noteId, at:Date.now() },
      ...prev.filter(r => !(r.subjectId === subjectId && r.noteId === noteId))
    ].slice(0, 14));
    go("note", { subjectId, noteId });
  };

  const saveResult = (subjectId, result) => {
    setResults(prev => ({ ...prev, [subjectId]: result }));
    const pct = Math.round((result.score / result.total) * 100);
    toast("Quiz submitted — you scored " + pct + "%");
  };

  const ctx = {
    screen, params, go, navigate, back,
    user, setUser, prefs, setPrefs,
    loggedIn, signIn, signOut,
    premium, setPremium,
    bookmarks, toggleBookmark,
    recent, openNote,
    results, saveResult,
    toast,
    quizzes: QUIZZES,
    subjects: ALL_SUBJECTS
  };

  const effectiveScreen = (!loggedIn && screen !== "welcome" && screen !== "auth") ? "welcome" : screen;

  let content = null;
  if(effectiveScreen === "welcome"){ content = html`<${Welcome} />`; }
  else if(effectiveScreen === "auth"){ content = html`<${Auth} />`; }
  else if(effectiveScreen === "ai") { content = html`<${Shell} activeId="dashboard"><${AIChat} /></${Shell}>`; }
  else {
    const map = {
      dashboard: [html`<${Dashboard} />`, "dashboard"],
      subjects:  [html`<${Subjects} />`, "subjects"],
      subject:   [html`<${SubjectDetail} />`, "subjects"],
      note:      [html`<${NoteReader} />`, "subjects"],
      "3d-model":[html`<${ThreeDViewer} />`, "subjects"],
      quizzes:   [html`<${Quizzes} />`, "quizzes"],
      quiz:      [html`<${QuizPlayer} />`, "quizzes"],
      quizResult:[html`<${QuizResult} />`, "quizzes"],
      library:   [html`<${Library} />`, "library"],
      premium:   [html`<${Premium} />`, "profile"],
      profile:   [html`<${Profile} />`, "profile"]
    };
    const entry = map[effectiveScreen] || map.dashboard;
    content = html`<${Shell} activeId=${entry[1]}>${entry[0]}</${Shell}>`;
  }

  return html`<${AppCtx.Provider} value=${ctx}>
    ${content}
    <${ToastStack} toasts=${toasts} />
  </${AppCtx.Provider}>`;
}

try {
  ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
} catch(err){
  window.__ssCrash("Render error", (err && err.message) || String(err));
}

})();
</script>
</body>
</html>
